[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "canticle-ghost"
version = "0.1.0"
description = "A DeepAgent with durable MIRL memory through the private SEAM SDK"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents>=0.5.9,<0.6",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  # Persistent LangGraph checkpoints. Without it `--thread-id` is in-process
  # only, so an interrupted thread cannot be resumed -- Stage 1's exit
  # condition. Execution state only; SEAM remains the semantic memory.
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "seam-sdk[pgvector] @ git+ssh://git@github.com/Canticle-AI-Research/Seam_SDK.git@294ab08919646a03dcdceb3c777dfd7d8eabc624",
]

[project.scripts]
ghost = "ghost.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.15,<1",
  # Brand asset generation (tools/branding). Pillow writes the multi-size ICO;
  # headless Chrome and ffmpeg are system tools, not Python dependencies.
  "pillow>=11,<14",
  # tests/test_ci_contract.py parses .github/workflows/ci.yml.
  "pyyaml>=6,<7",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]

[tool.pytest.ini_options]
# `-m "not live"` DESELECTS the live-provider tests rather than skipping them.
# A skip would be invisible, and conftest.py's strict no-skip would fail the
# run. The live CI job selects them back with `-m live`.
addopts = "-q -m 'not live'"
testpaths = ["tests"]
markers = [
  "live: exercises a real model provider; costs money and needs an API key",
]
# `tools` is a repo-root package that is deliberately not shipped in the wheel,
# so the root must be importable for tests/test_brand_assets.py to collect.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
