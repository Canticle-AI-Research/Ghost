[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "canticle-ghost"
version = "0.1.0"
description = "A DeepAgent with durable MIRL memory through the private SEAM SDK"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents>=0.5.9,<0.6",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  # Persistent LangGraph checkpoints. Without it `--thread-id` is in-process
  # only, so an interrupted thread cannot be resumed -- Stage 1's exit
  # condition. Execution state only; SEAM remains the semantic memory.
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "seam-sdk[pgvector] @ git+ssh://git@github.com/Canticle-AI-Research/Seam_SDK.git@294ab08919646a03dcdceb3c777dfd7d8eabc624",
]

[project.scripts]
ghost = "ghost.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.15,<1",
  # Brand asset generation (tools/branding). Pillow writes the multi-size ICO;
  # headless Chrome and ffmpeg are system tools, not Python dependencies.
  "pillow>=11,<14",
  # tests/test_ci_contract.py parses .github/workflows/ci.yml.
  "pyyaml>=6,<7",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]

[tool.pytest.ini_options]
# `-m "not live"` DESELECTS the live-provider tests rather than skipping them.
# A skip would be invisible, and conftest.py's strict no-skip would fail the
# run. The live CI job selects them back with `-m live`.
addopts = "-q -m 'not live'"
testpaths = ["tests"]
markers = [
  "live: exercises a real model provider; costs money and needs an API key",
]
# `tools` is a repo-root package that is deliberately not shipped in the wheel,
# so the root must be importable for tests/test_brand_assets.py to collect.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff implements pylint's checks (the PL rules), so this is the whole linter
# rather than one of two. A second tool with its own config would duplicate
# these findings and disagree at the edges.
#
# Deliberately excluded: PLR (refactor opinions like argument counts), D
# (docstring style -- this codebase writes docstrings for readers, not for a
# checker), and ANN (annotations are already near-total and mypy is the right
# tool for the rest).
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes: real errors
  "I",           # import order
  "UP",          # pyupgrade
  "B",           # bugbear: likely bugs
  "SIM",         # simplifications
  "C4",          # comprehensions
  "PLE", "PLW",  # pylint errors and warnings
  "RUF",         # ruff-specific
  "S",           # bandit: security. Load-bearing now that Ghost has a shell.
  "DTZ",         # naive datetimes
  "A",           # builtin shadowing
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use literals, and import lazily inside test bodies on purpose.
# A002: test fakes implement the AgentGraph protocol, whose parameter is named
# `input` by LangGraph; renaming it in the fake would break the contract.
"tests/*" = ["S101", "S105", "S108", "PLR2004", "PLC0415", "A002"]
# The CLI's whole job is printing to a terminal.
"src/ghost/cli.py" = ["T201"]
# `input` is LangGraph's parameter name on the graph protocol; renaming it would
# break the call, and the shadowing is confined to a Protocol signature.
"src/ghost/lifecycle.py" = ["A002"]
# The brand toolkit shells out to Chrome and ffmpeg by design, resolved from
# PATH because that is where those tools live on a developer machine.
"tools/branding/assets.py" = ["S603", "S607"]
