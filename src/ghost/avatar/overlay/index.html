<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Desktop Avatar</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body class="transparent-mode">
  <canvas id="stage"></canvas>

  <div id="ui-container">
    <div id="status-pill" class="glass-pill">
      <span class="status-dot"></span>
      <span id="agent-status">Ghost: Idle</span>
      <button id="bg-toggle" title="Toggle Background / Transparency">BG</button>
      <button id="stealth-toggle" title="Toggle stealth">Stealth</button>
    </div>

    <div id="speech-bubble" class="anime-dialog-box hidden">
      <div class="dialog-header">
        <span class="avatar-tag">GHOST</span>
      </div>
      <div id="speech-text" class="dialog-content">...</div>
      <div class="dialog-tail"></div>
    </div>

    <div id="action-tray" class="action-dock">
      <button class="action-btn" data-action="simulate_search">Search</button>
      <button class="action-btn" data-action="simulate_open">Open folder</button>
      <button class="action-btn" data-action="finish">Done</button>
      <button class="action-btn" data-action="stealth">Stealth</button>
    </div>
  </div>

  <script src="engine.js"></script>
</body>
</html>
