<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     class="rgb" role="img" aria-label="Ghost">
  <title>Ghost</title>
  <desc>Reduced Ghost mark for small sizes: silhouette, drawn rim, and the prompt and cursor eyes.</desc>
  <!--
    Small size companion to ghost.svg. Same form, same RGB cycle, same eyes.

    Everything that depends on being read at size is removed: the neural
    constellation, the nebula bloom, the ambient aura, and the wide feathered
    body layer. Below roughly 32px those dissolve into a coloured smudge that
    costs the silhouette its clarity without contributing anything legible.

    What remains is tuned for small rendering rather than scaled down from the
    full mark. The rim is heavier and its blur is lower, the body is flatter,
    and the eyes are slightly larger and further apart, because at 16px their
    separation is the only thing that says face.

    Use this at 32px and below, and for the favicon. Use ghost.svg above that.
  -->
  <style>
    @keyframes rgb {
      0%   { color: #f7768e } 14%  { color: #ff9e64 }
      28%  { color: #e0af68 } 42%  { color: #9ece6a }
      57%  { color: #7dcfff } 71%  { color: #7aa2f7 }
      85%  { color: #c4a7e7 } 100% { color: #f7768e }
    }
    @keyframes blink { 0% { opacity:1 } 50% { opacity:0 } 100% { opacity:1 } }
    .rgb { animation: rgb 8000ms linear infinite; }
    .cursor { animation: blink 800ms step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      .rgb, .cursor { animation: none; }
      .rgb { color: #c4a7e7; }
    }
  </style>

  <defs>
    <path id="form" d="M 22 68 L 22 45 A 26 26 0 0 1 74 45 L 74 68
                       C 65 72, 57 64, 48 70 C 39 76, 31 67, 22 68 Z"/>
    <radialGradient id="flesh" cx="50%" cy="40%" r="66%">
      <stop offset="0%"   stop-color="currentColor" stop-opacity=".42"/>
      <stop offset="70%"  stop-color="currentColor" stop-opacity=".26"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity=".16"/>
    </radialGradient>
    <filter id="rimglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="rimline" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".22"/>
    </filter>
  </defs>

  <use href="#form" fill="url(#flesh)"/>
  <use href="#form" fill="none" stroke="currentColor" stroke-width="3.2"
       opacity=".4" filter="url(#rimglow)"/>
  <use href="#form" fill="none" stroke="currentColor" stroke-width="2.2"
       opacity="1" filter="url(#rimline)"/>

  <path d="M 33 37 L 40 44 L 33 51" fill="none" stroke="currentColor"
        stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="53" y="35.4" width="8" height="15" rx="1.5" fill="currentColor"/>
</svg>
