name: Live Provider CI

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run paid live-provider tests against the configured SEAM service
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-config-present:
    # Secrets cannot be read in a job-level condition. This hosted preflight
    # turns an unconfigured deployment into a visible skip, not a failure.
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check live-provider and SEAM service configuration
        id: check
        env:
          PROVIDER_KEY: ${{ secrets.GHOST_LIVE_OPENAI_API_KEY }}
          SEAM_URL: ${{ secrets.GHOST_LIVE_SEAM_BASE_URL }}
          SEAM_TOKEN: ${{ secrets.GHOST_LIVE_SEAM_API_TOKEN }}
        run: |
          if [ -n "${PROVIDER_KEY}" ] && [ -n "${SEAM_URL}" ] && [ -n "${SEAM_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live provider or SEAM service configuration is incomplete."
          fi

  live:
    # Paid and stateful by design: never automatic on public pull requests.
    needs: live-config-present
    if: >-
      inputs.run_live == true &&
      needs.live-config-present.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install public project dependencies
        run: uv sync --frozen

      - name: Run live agent tests
        env:
          OPENAI_API_KEY: ${{ secrets.GHOST_LIVE_OPENAI_API_KEY }}
          SEAM_BASE_URL: ${{ secrets.GHOST_LIVE_SEAM_BASE_URL }}
          SEAM_API_TOKEN: ${{ secrets.GHOST_LIVE_SEAM_API_TOKEN }}
        run: uv run --frozen python -m pytest -m live -v
