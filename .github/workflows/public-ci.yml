name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow is deliberately credential-free. It must never install Ghost,
# resolve the private SEAM SDK, use repository secrets, or target a self-hosted
# runner. Private integration lives in the manual-only Private CI workflow.
jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Lint
        run: uv run --no-project --with 'ruff>=0.15,<1' ruff check .

      - name: Verify documentation and CI contracts
        run: >-
          uv run --no-project --with 'pytest>=8.3,<10' --with 'pyyaml>=6,<7'
          pytest tests/test_docs.py tests/test_ci_contract.py -q

      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact --exit-code 1

  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Preflight brand renderers
        run: |
          set -euo pipefail
          missing=""
          command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || missing="${missing} chrome"
          command -v fc-match >/dev/null 2>&1 || missing="${missing} fontconfig"
          if [ -n "${missing}" ]; then
            echo "::error::runner is missing brand renderers:${missing}"
            exit 1
          fi

      - name: Verify brand asset toolkit
        run: >-
          uv run --no-project --with 'pytest>=8.3,<10' --with 'pillow>=11,<14'
          pytest tests/test_brand_assets.py -q

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify package members and entry point
        run: |
          set -euo pipefail
          uv run --no-project python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, got {wheels}"
          assert sorted(Path("dist").glob("*.tar.gz")), "no source distribution built"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              entry_points = next(name for name in names if name.endswith("entry_points.txt"))
              declared = archive.read(entry_points).decode()
          required = ("ghost/__init__.py", "ghost/cli.py", "ghost/seam_memory.py")
          missing = [name for name in required if name not in names]
          assert not missing, f"wheel is missing modules: {missing}"
          assert "ghost = ghost.cli:main" in declared
          PY
