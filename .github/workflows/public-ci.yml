name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    # This lane is intentionally credential-free and safe for a public fork.
    # It must never install Ghost or contact the private SEAM repositories.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Verify append-only history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No prior revision with HISTORY.md; append-only comparison is not applicable."
          else
            uv run --no-project python -m tools.history.verify_append_only --base-ref "${BASE_SHA}"
          fi

      - name: Verify continuity and rebuild documentation
        run: |
          uv run --no-project python -m tools.history.verify_continuity
          uv run --no-project --with 'pytest>=8.3,<10' --with 'pyyaml>=6,<7' \
            --with 'httpx>=0.27,<1' \
            pytest tests/test_docs.py tests/test_history_tools.py tests/test_licensing.py \
            tests/test_temporal_chain.py tests/test_ci_contract.py \
            tests/test_recorded_facts.py tests/test_local_gates.py -q

      - name: Lint (correctness + import order)
        # The whole tree, not a subset: a narrowed lint scope is how a finding
        # in an unlisted path stays green forever.
        run: uv run --no-project --with 'ruff>=0.15,<1' ruff check .

      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gitleaks" dir . --no-banner --redact --exit-code 1

  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Preflight brand renderers
        # Their absence has to be a loud, named failure. Otherwise a runner
        # image change surfaces as
        # "render_png produced a blank canvas", which reads as a brand bug.
        # fc-match matters specifically: check_fonts() returns {} without it and
        # the font test then fails with a message about the toolkit, not the box.
        run: |
          set -euo pipefail
          missing=""
          command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || missing="${missing} chrome"
          command -v fc-match >/dev/null 2>&1 || missing="${missing} fontconfig"
          if [ -n "${missing}" ]; then
            echo "::error::runner is missing brand renderers:${missing}"
            exit 1
          fi
          echo "renderers present: $(command -v google-chrome || command -v chromium), $(command -v fc-match)"

      - name: Verify brand asset toolkit
        # Pillow renders the assets. httpx supports the shared public-SEAM test
        # fake imported by conftest; neither dependency reaches a private source.
        run: >-
          uv run --no-project --with 'pytest>=8.3,<10' --with 'pillow>=11,<14'
          --with 'httpx>=0.27,<1'
          pytest tests/test_brand_assets.py -q

  tests:
    # Ghost's public wheel has no private source dependency. The complete
    # provider-free suite therefore runs automatically on disposable hosted
    # runners for every PR and main push.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # History verification in the complete suite resolves every recorded
          # commit, so a shallow checkout is not a valid test environment.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify lock and install public dependencies
        run: |
          uv lock --check
          uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run the complete provider-free suite
        run: uv run --frozen python -m pytest --durations=10

      - name: Smoke the installed command
        run: uv run --frozen ghost --help

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and source distribution
        # Building and clean-installing the artifact proves its dependency
        # graph is fully public and the console command imports successfully.
        run: uv build

      - name: Clean-install and smoke the wheel
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          uv venv "${RUNNER_TEMP}/ghost-wheel"
          uv pip install --python "${RUNNER_TEMP}/ghost-wheel/bin/python" dist/*.whl
          "${RUNNER_TEMP}/ghost-wheel/bin/ghost" --help

  stage1-evals:
    # Deterministic BIL-0 only: this proves the frozen corpus, comparison arms,
    # safety gate, and bundle integrity. It never contacts a model or service.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Seal and verify Stage 1 contract smoke
        run: |
          uv sync --frozen
          uv run --frozen python -m tools.evaluation validate-fixtures
          uv run --frozen python -m tools.evaluation smoke \
            --output "${RUNNER_TEMP}/ghost-stage1-smoke.json"
          uv run --frozen python -m tools.evaluation verify \
            "${RUNNER_TEMP}/ghost-stage1-smoke.json"
          uv run --frozen python -m tools.evaluation gate \
            "${RUNNER_TEMP}/ghost-stage1-smoke.json"
